name: Release Native Artifacts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-rust-core:
    name: Test Unified Rust Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Core Test Suite (Math, CRDT Sync, Workspace v2)
        run: cargo test --manifest-path semester-core/Cargo.toml

  build-android:
    name: Build Native Android APK (ARM64 + x86_64 Rust Core)
    needs: test-rust-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Rust & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Compile Rust Core for Android (.so) & Refresh UniFFI Bindings
        run: |
          cd semester-core
          cargo ndk -t arm64-v8a -t x86_64 -o ../semester-android/app/src/main/jniLibs build --release
          cargo run --bin uniffi-bindgen -- generate --library ../semester-android/app/src/main/jniLibs/arm64-v8a/libsemester_core.so --language kotlin --out-dir ../semester-android/app/src/main/java

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Release APK
        run: |
          cd semester-android
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Semester-android.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Semester-Android-APK
          path: semester-android/app/build/outputs/apk/release/Semester-android.apk

  build-windows:
    name: Build Windows Desktop Installer (.exe)
    needs: test-rust-core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        run: npm ci --prefix frontend

      - name: Test Desktop Rust Backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build Tauri NSIS Installer
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: Semester-Windows-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/Semester.exe

  publish-release:
    name: Publish to GitHub Releases
    needs: [build-android, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            **/*.apk
            **/*.exe
