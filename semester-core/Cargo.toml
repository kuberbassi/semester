[package]
name = "semester-core"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "semester_core"

[dependencies]
base64 = "0.22"
chrono = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
uniffi = { version = "0.28", features = ["cli"] }
uuid = { version = "1", features = ["v4"] }
